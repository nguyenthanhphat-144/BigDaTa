services:
  namenode1:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode1
    hostname: namenode1
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=bd02-fraud-cluster
      - MULTIHOMED_NETWORK=1
      - CORE_CONF_fs_defaultFS=hdfs://namenode1:9000
      - HDFS_CONF_dfs_replication=3
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    volumes:
      - bd02_namenode:/hadoop/dfs/name

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    restart: always
    ports:
      - "9864:9864"
      - "9866:9866"
      - "9867:9867"
    environment:
      - SERVICE_PRECONDITION=namenode1:9870
      - MULTIHOMED_NETWORK=1
      - CORE_CONF_fs_defaultFS=hdfs://namenode1:9000
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:9866
      - HDFS_CONF_dfs_datanode_http_address=0.0.0.0:9864
      - HDFS_CONF_dfs_datanode_ipc_address=0.0.0.0:9867
    volumes:
      - bd02_datanode1:/hadoop/dfs/data
    depends_on:
      - namenode1

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    restart: always
    ports:
      - "9865:9864"
      - "9876:9876"
      - "9877:9877"
    environment:
      - SERVICE_PRECONDITION=namenode1:9870
      - MULTIHOMED_NETWORK=1
      - CORE_CONF_fs_defaultFS=hdfs://namenode1:9000
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:9876
      - HDFS_CONF_dfs_datanode_http_address=0.0.0.0:9864
      - HDFS_CONF_dfs_datanode_ipc_address=0.0.0.0:9877
    volumes:
      - bd02_datanode2:/hadoop/dfs/data
    depends_on:
      - namenode1

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode3
    hostname: datanode3
    restart: always
    ports:
      - "9868:9864"
      - "9886:9886"
      - "9887:9887"
    environment:
      - SERVICE_PRECONDITION=namenode1:9870
      - MULTIHOMED_NETWORK=1
      - CORE_CONF_fs_defaultFS=hdfs://namenode1:9000
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:9886
      - HDFS_CONF_dfs_datanode_http_address=0.0.0.0:9864
      - HDFS_CONF_dfs_datanode_ipc_address=0.0.0.0:9887
    volumes:
      - bd02_datanode3:/hadoop/dfs/data
    depends_on:
      - namenode1

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    hostname: zookeeper
    restart: always
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    hostname: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "transactions:3:1,alerts:3:1"
    depends_on:
      - zookeeper

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow
    hostname: airflow
    user: "0:0"
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow_db/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__FERNET_KEY=8B8uQ_7wZ6mK4p2X9vL1nJ5tR3yH0cE4aG7sF2dM9qW=
      - AIRFLOW__WEBSERVER__SECRET_KEY=bd02_nhom15_airflow_secret_key_2026
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - PYTHONPATH=/opt/airflow/project
      - HOST_SPARK_API=http://host.docker.internal:5000
      - HDFS_WEBHDFS_INTERNAL=http://namenode1:9870
      - KAFKA_INTERNAL_SERVERS=kafka:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/opt/airflow/project
      - bd02_airflow_db:/opt/airflow_db
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow_db /opt/airflow/logs &&
        airflow db migrate &&
        (airflow users create --username admin --firstname Nhom15 --lastname Admin --role Admin --email admin@nhom15.edu.vn --password admin || true) &&
        (airflow scheduler &) &&
        exec airflow webserver --port 8080
    depends_on:
      - namenode1
      - kafka

volumes:
  bd02_namenode:
  bd02_datanode1:
  bd02_datanode2:
  bd02_datanode3:
  bd02_airflow_db:
